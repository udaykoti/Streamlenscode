services:
  - type: web
    name: streamlens-api
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    envVars:
      - key: JAVA_OPTS
        value: "-Xmx512m"
      - key: SERVER_PORT
        value: "8080"

  - type: web
    name: streamlens-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: ""

databases:
  - name: streamlens-db
    databaseName: streamlens
    plan: free
    ipAllowList: []
